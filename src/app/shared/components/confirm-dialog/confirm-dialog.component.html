<div class="overlay" *ngIf="visible">
  <div class="dialog">
    <h3>{{ title }}</h3>
    <p>{{ message }}</p>
    <div class="dialog-actions">
      <button class="btn btn-secondary" (click)="cancel.emit()">Cancel</button>
      <button class="btn btn-danger"    (click)="confirm.emit()">{{ confirmLabel }}</button>
    </div>
  </div>
</div>
