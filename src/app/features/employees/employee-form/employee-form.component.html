<div class="page">
  <div class="back-link">
    <a routerLink="/employees">← Back to list</a>
  </div>

  <h1>{{ isEdit ? 'Edit Employee' : 'New Employee' }}</h1>

  <form [formGroup]="form" (ngSubmit)="submit()" class="form-card" novalidate>

    <!-- First Name + Last Name row -->
    <div class="form-row">
      <div class="form-group">
        <label for="firstName">First Name *</label>
        <input id="firstName" formControlName="firstName" class="input" />
        <span class="err" *ngIf="isInvalid('firstName', 'required')">
          First name is required
        </span>
      </div>

      <div class="form-group">
        <label for="lastName">Last Name *</label>
        <input id="lastName" formControlName="lastName" class="input" />
        <span class="err" *ngIf="isInvalid('lastName', 'required')">
          Last name is required
        </span>
      </div>
    </div>

    <!-- Email -->
    <div class="form-group">
      <label for="email">Email *</label>
      <input id="email" formControlName="email" class="input" type="email" />
      <span class="err" *ngIf="isInvalid('email', 'required')">Email is required</span>
      <span class="err" *ngIf="isInvalid('email', 'email')">Enter a valid email address</span>
      <span class="err" *ngIf="isInvalid('email', 'emailTaken')">This email is already in use</span>
      <!-- Shows while async validator is checking -->
      <span class="hint" *ngIf="form.get('email')?.pending">Checking email…</span>
    </div>

    <!-- Role + Status row -->
    <div class="form-row">
      <div class="form-group">
        <label for="role">Role *</label>
        <select id="role" formControlName="role" class="input select">
          <option value="">Select a role…</option>
          <option value="ADMIN">Admin</option>
          <option value="MANAGER">Manager</option>
          <option value="SUPPORT">Support</option>
        </select>
        <span class="err" *ngIf="isInvalid('role', 'required')">Role is required</span>
      </div>

      <div class="form-group">
        <label for="status">Status</label>
        <select id="status" formControlName="status" class="input select">
          <option value="ACTIVE">Active</option>
          <option value="INACTIVE">Inactive</option>
        </select>
      </div>
    </div>

    <!-- Actions -->
    <div class="form-actions">
      <a routerLink="/employees" class="btn btn-secondary">Cancel</a>
      <button
        type="submit"
        class="btn btn-primary"
        [disabled]="form.invalid || form.pending || (loading$ | async)">
        {{ isEdit ? 'Save Changes' : 'Create Employee' }}
      </button>
    </div>

  </form>
</div>
